<!DOCTYPE html>
<html>
<head>
    <title>Live Class</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #121212;
            color: white;
            text-align: center;
        }

        video {
            width: 70%;
            margin-top: 30px;
            border-radius: 12px;
            background: black;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .end {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

<h2>Live Class</h2>

<iframe 
    src="https://meet.jit.si/{{ room_id }}" 
    width="100%" 
    height="500" 
    allow="camera; microphone; fullscreen"
    style="border-radius:12px;"
></iframe>

<br>

{% if role == "teacher" %}
<button onclick="startCamera()">Start Camera</button>
<form method="POST" action="/teacher/end-live/{{ room_id }}">
    <button type="submit" class="end">End Class</button>
</form>
{% endif %}
<button onclick="leaveClass()">Leave Class</button>

<script>
const socket = io();
const room = "{{ room_id }}";
const role = "{{ role }}";
socket.on("connect", () => {
    socket.emit("join_room", {
        room: room
    });
});

let localStream;
let peerConnection;

const config = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};


async function startCamera(){

    localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    });

    const video = document.getElementById("camera");
    video.srcObject = localStream;
    video.muted = true;

    // 🔥 ONLY TEACHER STARTS STREAMING
    if(role === "teacher"){
        startStreaming();
    }
}

async function startStreaming(){

    peerConnection = new RTCPeerConnection(config);

    // send teacher video tracks
    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    // ICE candidates
    peerConnection.onicecandidate = event => {
        if(event.candidate){
            socket.emit("ice_candidate", {
                room: room,
                candidate: event.candidate
            });
        }
    };

    // create offer
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    // send offer to students
    socket.emit("video_offer", {
        room: room,
        offer: offer
    });
}

socket.on("video_offer", async (data) => {

    // only students handle this
    if(role !== "student") return;

    peerConnection = new RTCPeerConnection(config);

    // 🔥 THIS SHOWS VIDEO ON STUDENT SIDE
    peerConnection.ontrack = (event) => {
        const video = document.getElementById("camera");
        video.srcObject = event.streams[0];
    };

    // ICE handling
    peerConnection.onicecandidate = event => {
        if(event.candidate){
            socket.emit("ice_candidate", {
                room: room,
                candidate: event.candidate
            });
        }
    };

    await peerConnection.setRemoteDescription(data.offer);

    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    socket.emit("video_answer", {
        room: room,
        answer: answer
    });
});

// teacher receives answer
socket.on("video_answer", async (data) => {
    if(role !== "teacher") return;

    await peerConnection.setRemoteDescription(data.answer);
});


// both sides handle ICE
socket.on("ice_candidate", async (data) => {
    if(peerConnection){
        try{
            await peerConnection.addIceCandidate(data.candidate);
        } catch(e){
            console.error("ICE error:", e);
        }
    }
});

function leaveClass(){

    fetch("/leave/{{ room_id }}")
    .then(() => {
        window.location.href = "/dashboard";
    });

}

// 🔥 CHECK IF CLASS ENDED EVERY 3 SECONDS
setInterval(() => {

    fetch("/check_class/{{ room_id }}")
    .then(res => res.json())
    .then(data => {

        if(data.status === "ended"){
            alert("Class Ended");
            window.location.href = "/student/classroom/{{ classroom_id }}";
        }

    });

}, 3000);



</script>

</body>
</html>
