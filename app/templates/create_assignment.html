<!DOCTYPE html>
<html>
<head>
    <title>Create Assignment</title>

<style>

/* =========================
COLOR THEME
========================= */

:root{
--green:#64a959;
--green-light:#60ca82;
--purple:#7C3AED;
--bg:#FFFFFF;
--text:#111111;
--card:#FFFFFF;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
margin:0;
padding:60px 80px;
background:var(--bg);
color:var(--text);
font-family:"Poppins", sans-serif;
overflow-x:hidden;
}

/* =========================
FLOATING SHAPES
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 14s infinite ease-in-out alternate;
}

.shape1{
width:220px;
height:220px;
background:var(--green);
top:5%;
left:-80px;
}

.shape2{
width:260px;
height:260px;
background:var(--purple);
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-30px);}
100%{transform:translateY(30px);}
}

/* =========================
OUTLINE RINGS
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
animation:floatRing 16s infinite ease-in-out alternate;
}

.ring1{
width:240px;
height:140px;
border:2px solid rgba(100,169,89,0.25);
top:20%;
right:10%;
}

.ring2{
width:200px;
height:120px;
border:2px solid rgba(124,58,237,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatRing{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(20px);}
}

/* =========================
TITLE
========================= */

h2{
font-size:34px;
margin-bottom:30px;
}

h2 span{
color:var(--purple);
}

/* =========================
FORM CARD
========================= */

form{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:70px;
border-radius:20px;
max-width:500px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
animation:fadeUp 0.8s ease;
}

/* =========================
LABEL
========================= */

label{
display:block;
margin-bottom:6px;
font-size:14px;
color:#666;
}

/* =========================
INPUTS
========================= */

input,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid var(--border);
margin-bottom:18px;
font-size:15px;
transition:0.3s;
background:#fafafa;
}

textarea{
min-height:120px;
resize:vertical;
}

input:focus,
textarea:focus{
outline:none;
border-color:var(--purple);
background:white;
box-shadow:0 0 0 3px rgba(124,58,237,0.15);
}

/* =========================
BUTTON
========================= */

button{
background:var(--green);
color:white;
border:none;
padding:14px 24px;
border-radius:12px;
font-weight:600;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:black;
transform:translateY(-2px);
}

/* =========================
BACK LINK
========================= */

.back-link{
display:inline-block;
margin-top:30px;
font-size:14px;
text-decoration:none;
color:var(--purple);
font-weight:600;
}

.back-link:hover{
color:black;
}

/* =========================
ANIMATION
========================= */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>
    <div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>

<h2>Create Assignment</h2>

<form method="POST" enctype="multipart/form-data">

    <label>Title</label>
    <input type="text" name="title" required>

    <label>Description</label>
    <textarea name="description"></textarea>

    <label>Upload Question File (PDF/DOC)</label>
    <input type="file" name="file">

    <label>Due Date</label>
    <input type="date" name="due_date">

    <button type="submit">Create Assignment</button>

</form>

<a href="javascript:history.back()" class="back-link">
    ⬅ Back
</a>

</body>
</html>
