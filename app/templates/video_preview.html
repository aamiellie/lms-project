<!DOCTYPE html>
<html>
<head>
    <title>AI Video Creation</title>

<style>

/* =========================
COLOR THEME
========================= */

:root{
--green:#64a959;
--green-light:#60ca82;
--purple:#7C3AED;
--bg:#FFFFFF;
--text:#111111;
--card:#FFFFFF;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
margin:0;
padding:60px 80px;
background:var(--bg);
color:var(--text);
font-family:"Poppins", sans-serif;
overflow-x:hidden;
}

/* =========================
FLOATING SHAPES
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 14s infinite ease-in-out alternate;
}

.shape1{
width:220px;
height:220px;
background:var(--green);
top:5%;
left:-80px;
}

.shape2{
width:260px;
height:260px;
background:var(--purple);
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-30px);}
100%{transform:translateY(30px);}
}

/* =========================
OUTLINE RINGS
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
animation:floatRing 16s infinite ease-in-out alternate;
}

.ring1{
width:240px;
height:140px;
border:2px solid rgba(100,169,89,0.25);
top:20%;
right:10%;
}

.ring2{
width:200px;
height:120px;
border:2px solid rgba(124,58,237,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatRing{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(20px);}
}

/* =========================
TITLES
========================= */

h2{
font-size:32px;
margin-bottom:25px;
}

h3{
font-size:22px;
margin:25px 0 15px;
color:var(--purple);
}

/* =========================
STEP CARD
========================= */

.step-card{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
margin-bottom:30px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
animation:fadeUp 0.6s ease;
}

/* =========================
TEXTAREA
========================= */

textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid var(--border);
font-size:15px;
margin-bottom:18px;
resize:vertical;
background:#fafafa;
transition:0.3s;
}

textarea:focus{
outline:none;
border-color:var(--purple);
background:white;
box-shadow:0 0 0 3px rgba(124,58,237,0.15);
}

/* =========================
BUTTONS (IMPORTANT)
========================= */

button{
padding:12px 22px;
border:none;
border-radius:12px;
font-weight:600;
font-size:14px;
cursor:pointer;
transition:0.3s;
}

/* Different actions */

button[type="submit"]{
background:var(--green);
color:white;
}

button[type="submit"]:hover{
background:black;
transform:translateY(-2px);
}

/* =========================
MEDIA (AUDIO + VIDEO)
========================= */

audio,
video{
margin-top:20px;
border-radius:12px;
width:100%;
max-width:650px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* =========================
BACK LINK
========================= */

.back-link{
display:inline-block;
margin-top:30px;
font-size:14px;
text-decoration:none;
color:var(--purple);
font-weight:600;
}

.back-link:hover{
color:black;
}

/* =========================
ANIMATION
========================= */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
} 
</style>
</head>

<body>

<h2>Extracted Content Preview</h2>

<!-- STEP 1 -->
<div class="step-card">
    <form method="POST">
        <input type="hidden" name="source_file" value="{{ source_file }}">
        <input type="hidden" name="presenter" value="{{ presenter }}">
        <input type="hidden" name="title" value="{{ title }}">
        <input type="hidden" name="description" value="{{ description }}">
        <input type="hidden" name="action" value="generate_narration">

        <textarea name="extracted_text" rows="12">
{{ extracted_text }}
        </textarea>

        <button type="submit">Generate AI Narration</button>
    </form>
</div>


{% if narration %}
<h3>AI Generated Narration</h3>

<div class="step-card">
    <form method="POST">
        <input type="hidden" name="source_file" value="{{ source_file }}">
        <input type="hidden" name="presenter" value="{{ presenter }}">
        <input type="hidden" name="title" value="{{ title }}">
        <input type="hidden" name="description" value="{{ description }}">
        <input type="hidden" name="action" value="generate_audio">

        <textarea name="narration" rows="12">
{{ narration }}
        </textarea>

        <button type="submit">Generate Audio</button>
    </form>
</div>
{% endif %}


{% if audio_file %}
<h3>Narration Audio</h3>

<div class="step-card">
    <audio controls>
        <source src="/audio/{{ audio_file }}" type="audio/mpeg">
    </audio>

    <form method="POST" style="margin-top:20px;">
        <input type="hidden" name="source_file" value="{{ source_file }}">
        <input type="hidden" name="presenter" value="{{ presenter }}">
        <input type="hidden" name="title" value="{{ title }}">
        <input type="hidden" name="description" value="{{ description }}">
        <input type="hidden" name="action" value="generate_video">
        <input type="hidden" name="audio_file" value="{{ audio_file }}">

        <textarea name="narration" style="display:none;">
{{ narration }}
        </textarea>

        <textarea name="extracted_text" style="display:none;">
{{ extracted_text }}
        </textarea>

        <button type="submit">Generate Final Video</button>
    </form>
</div>
{% endif %}


{% if video_file %}
<h3>Final Lecture Video</h3>

<div class="step-card">
    <video controls>
        <source src="/videos/{{ video_file }}" type="video/mp4">
    </video>
</div>
{% endif %}

<a href="/teacher/classroom/{{ classroom_id }}" class="back-link">
    ⬅ Back to Classroom
</a>

</body>
</html>
