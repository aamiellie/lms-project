<!DOCTYPE html>
<html>
<head>
    <title>After Class Quiz</title>
<style>

/* =========================
COLOR SYSTEM
========================= */

:root{
--bg:#FFFFFF;
--text:#190019;
--primary:#2B124C;
--secondary:#522B5B;
--accent:#854F6C;
--soft:#DFB6B2;
--light:#FBE4D8;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
font-family:"Poppins", sans-serif;
background:var(--bg);
color:var(--text);
padding:60px 100px;
font-size:16px;
overflow-x:hidden;
}

/* =========================
TITLE
========================= */

h2{
font-size:30px;
margin-bottom:10px;
color:var(--primary);
}

p strong{
color:#666;
font-size:14px;
}

/* =========================
FORM
========================= */

form{
margin-top:30px;
}

/* =========================
QUESTION CARD
========================= */

.question-card{
background:white;
border-radius:16px;
padding:22px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.05);
border:1px solid var(--light);
transition:0.3s;
}

.question-card:hover{
transform:translateY(-4px);
border-color:var(--soft);
}

.question-card p{
margin-bottom:12px;
font-size:16px;
}

/* =========================
OPTIONS
========================= */

label{
display:block;
margin-bottom:10px;
cursor:pointer;
padding:10px 12px;
border-radius:10px;
font-size:14px;
transition:0.3s;
}

label:hover{
background:var(--light);
}

input[type="radio"]{
margin-right:8px;
}

/* =========================
BUTTON
========================= */

button{
margin-top:20px;
padding:12px 22px;
background:var(--primary);
color:white;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
font-size:14px;
transition:0.3s;
}

button:hover{
background:var(--secondary);
transform:translateY(-2px);
}

/* =========================
BACK LINK
========================= */

a{
color:var(--primary);
text-decoration:none;
font-size:14px;
font-weight:500;
}

a:hover{
color:var(--accent);
}

/* =========================
FLOATING SHAPES (4s)
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 4s infinite ease-in-out alternate;
}

.shape1{
width:240px;
height:240px;
background:#DFB6B2;
top:5%;
left:-80px;
}

.shape2{
width:260px;
height:260px;
background:#522B5B;
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

/* =========================
MORE DYNAMIC RINGS 🔥
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
animation:floatRing 4s infinite ease-in-out alternate;
}

/* BIG RINGS */

.ring1{
width:260px;
height:150px;
border:2px solid rgba(43,18,76,0.25);
top:20%;
right:10%;
}

.ring2{
width:220px;
height:120px;
border:2px solid rgba(133,79,108,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

/* EXTRA SMALL RINGS (NEW 🔥) */

.ring3{
width:120px;
height:80px;
border:2px solid rgba(43,18,76,0.2);
top:40%;
left:10%;
animation-delay:2s;
}

.ring4{
width:100px;
height:60px;
border:2px solid rgba(133,79,108,0.2);
top:70%;
right:20%;
animation-delay:3s;
}

.ring5{
width:140px;
height:90px;
border:2px solid rgba(82,43,91,0.2);
top:10%;
right:30%;
animation-delay:1.5s;
}

/* =========================
SMALL CIRCLES
========================= */

.circle{
position:fixed;
border-radius:50%;
opacity:0.10;
z-index:-1;
animation:floatCircle 4s infinite ease-in-out alternate;
}

.circle1{
width:40px;
height:40px;
background:#522B5B;
top:40%;
left:20%;
}

.circle2{
width:30px;
height:30px;
background:#DFB6B2;
top:70%;
right:20%;
animation-delay:1s;
}

/* =========================
ANIMATIONS
========================= */

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-25px);}
100%{transform:translateY(25px);}
}

@keyframes floatRing{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(20px);}
}

@keyframes floatCircle{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(15px);}
}
</style>
</head>
<body>
<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>
<div class="ring ring4"></div>
<div class="ring ring5"></div>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<h2>📝 After-Class Quiz</h2>
<p><strong>{{ video.title }}</strong></p>

<form method="POST" action="{{ url_for('submit_after_quiz', classroom_id=classroom._id, video_id=video._id) }}">

    {% for q in questions %}
        <div class="question-card">
            <p><strong>{{ loop.index }}. {{ q.question }}</strong></p>

            {% set letters = ['A','B','C','D'] %}
            {% for option in q.options %}
                <label>
                    <input type="radio"
                           name="question_{{ q._id }}"
                           value="{{ letters[loop.index0] }}">
                    {{ letters[loop.index0] }}. {{ option }}
                </label><br>
            {% endfor %}
        </div>
        <hr>
    {% endfor %}

    <button type="submit">Submit Quiz</button>

</form>

<br>
<a href="/student/classroom/{{ classroom._id }}">⬅ Back</a>

</body>
</html>
