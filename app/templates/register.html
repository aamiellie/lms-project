<!DOCTYPE html>
<html>
<head>
    <title>Register | LMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
.auth-card h2{
margin-top:0;
margin-bottom:30px;
font-size:30px;
font-weight:500;
font-family: 'Dakota Motors', cursive;
}
/* =========================
COLOR THEME (MATCH HOME)
========================= */

:root{
--primary:#FF6F61;
--secondary:#FF9A8B;
--bg:#FFFFFF;
--text:#111111;
--card:#FFFFFF;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
margin:0;
font-family:"Poppins", sans-serif;
background:var(--bg);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:var(--text);
overflow:hidden;
}

/* =========================
FLOATING SHAPES
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 14s infinite ease-in-out alternate;
}

.shape1{
width:220px;
height:220px;
background:var(--primary);
top:10%;
left:-80px;
}

.shape2{
width:260px;
height:260px;
background:var(--secondary);
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-30px);}
100%{transform:translateY(30px);}
}

/* =========================
OUTLINE RINGS (NO GLOW)
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
pointer-events:none;
animation:floatRing 16s infinite ease-in-out alternate;
}

.ring1{
width:260px;
height:150px;
border:2px solid rgba(255,111,97,0.25);
top:20%;
right:10%;
}

.ring2{
width:200px;
height:120px;
border:2px solid rgba(0,0,0,0.15);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatRing{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(20px);}
}

/* =========================
AUTH CARD
========================= */

.auth-container{
width:100%;
display:flex;
justify-content:center;
align-items:center;
}

.auth-card{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:50px;
width:420px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
animation:fadeUp 0.8s ease;
}

.auth-card h2{
margin-top:0;
margin-bottom:30px;
font-size:30px;
font-weight:700;
}

/* =========================
INPUTS
========================= */

.input-group{
margin-bottom:22px;
}

label{
font-size:15px;
font-weight:500;
}

input,
select{
width:100%;
padding:14px;
margin-top:6px;
border-radius:10px;
border:1px solid var(--border);
font-size:15px;
transition:0.3s;
}

input:focus,
select:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 3px rgba(255,111,97,0.15);
}

/* =========================
BUTTON
========================= */

.auth-btn{
width:100%;
padding:15px;
background:var(--primary);
border:none;
border-radius:12px;
font-weight:600;
font-size:16px;
cursor:pointer;
margin-top:10px;
color:white;
transition:0.3s;
}

.auth-btn:hover{
background:black;
transform:translateY(-2px);
}

/* =========================
SWITCH TEXT
========================= */

.auth-switch{
margin-top:25px;
font-size:14px;
text-align:center;
}

.auth-switch a{
text-decoration:none;
color:var(--primary);
font-weight:600;
}

.auth-switch a:hover{
color:black;
}

/* =========================
ANIMATION
========================= */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>
<body>
<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<!-- Background Video -->


<div class="auth-container">

    <div class="auth-card">
        <h2>Create Account</h2>

        <form method="POST">

            <div class="input-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="input-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>

            <button type="submit" class="auth-btn">Register</button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>

</div>

</body>
</html>
