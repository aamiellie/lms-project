<!DOCTYPE html>
<html>
<head>
    <title>Live Class</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #121212;
            color: white;
            text-align: center;
        }

        video {
            width: 70%;
            margin-top: 30px;
            border-radius: 12px;
            background: black;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .end {
            background: red;
            color: white;
        }

        body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #f5f5f5);
    overflow-x: hidden;
}

/* floating circles */
.bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
}

.circle1 {
    width: 200px;
    height: 200px;
    background: #a5d6a7;
    top: 50px;
    left: 50px;
}

.circle2 {
    width: 150px;
    height: 150px;
    background: #90caf9;
    bottom: 80px;
    right: 80px;
}

.circle3 {
    width: 300px;
    height: 300px;
    border: 2px solid #81c784;
    top: 150px;
    right: 150px;
}

/* main container */
.container {
    padding: 30px;
}

/* card style */
.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

.btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

.btn.primary {
    background: #4CAF50;
    color: white;
}

.btn.danger {
    background: #e53935;
    color: white;
}

.btn.secondary {
    background: #e0e0e0;
}
    </style>
</head>

<body>

<!-- Background shapes -->
<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<!-- Main container -->
<div class="container">

    <h2 style="margin-bottom:20px;">Live Class</h2>

    <!-- Video Card -->
    <div class="card">
        <iframe 
            src="https://meet.jit.si/{{ room_id }}#userInfo.displayName={{ user_name }}" 
            width="100%" 
            height="500" 
            allow="camera; microphone; fullscreen"
            style="border-radius:12px; border:none;">
        </iframe>
    </div>

    <br>

    <!-- Controls Card -->
    <div class="card" style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">

        {% if role == "teacher" %}

            <button onclick="startCamera()" class="btn primary">
                Start Camera
            </button>

            <form method="POST" action="/teacher/end-live/{{ room_id }}" style="margin:0;">
                <button type="submit" class="btn danger">
                    End Class
                </button>
            </form>

        {% endif %}

        <button onclick="leaveClass()" class="btn secondary">
            Leave Class
        </button>

    </div>

</div>




<script>
const socket = io();
const room = "{{ room_id }}";
const role = "{{ role }}";
socket.on("connect", () => {
    socket.emit("join_room", {
        room: room
    });
});

let localStream;
let peerConnection;

const config = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};


async function startCamera(){

    localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    });

    const video = document.getElementById("camera");
    video.srcObject = localStream;
    video.muted = true;

    // 🔥 ONLY TEACHER STARTS STREAMING
    if(role === "teacher"){
        startStreaming();
    }
}

async function startStreaming(){

    peerConnection = new RTCPeerConnection(config);

    // send teacher video tracks
    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    // ICE candidates
    peerConnection.onicecandidate = event => {
        if(event.candidate){
            socket.emit("ice_candidate", {
                room: room,
                candidate: event.candidate
            });
        }
    };

    // create offer
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    // send offer to students
    socket.emit("video_offer", {
        room: room,
        offer: offer
    });
}

socket.on("video_offer", async (data) => {

    // only students handle this
    if(role !== "student") return;

    peerConnection = new RTCPeerConnection(config);

    // 🔥 THIS SHOWS VIDEO ON STUDENT SIDE
    peerConnection.ontrack = (event) => {
        const video = document.getElementById("camera");
        video.srcObject = event.streams[0];
    };

    // ICE handling
    peerConnection.onicecandidate = event => {
        if(event.candidate){
            socket.emit("ice_candidate", {
                room: room,
                candidate: event.candidate
            });
        }
    };

    await peerConnection.setRemoteDescription(data.offer);

    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    socket.emit("video_answer", {
        room: room,
        answer: answer
    });
});

// teacher receives answer
socket.on("video_answer", async (data) => {
    if(role !== "teacher") return;

    await peerConnection.setRemoteDescription(data.answer);
});


// both sides handle ICE
socket.on("ice_candidate", async (data) => {
    if(peerConnection){
        try{
            await peerConnection.addIceCandidate(data.candidate);
        } catch(e){
            console.error("ICE error:", e);
        }
    }
});

function leaveClass(){

    fetch("/leave/{{ room_id }}")
    .then(() => {
        window.location.href = "/dashboard";
    });

}

// 🔥 CHECK IF CLASS ENDED EVERY 3 SECONDS
let classEnded = false;

const interval = setInterval(() => {

    if(classEnded) return;

    fetch("/check_class/{{ room_id }}")
    .then(res => res.json())
    .then(data => {

        if(data.status === "ended"){

            classEnded = true;       // ✅ stop future alerts
            clearInterval(interval); // ✅ stop loop

            alert("Class Ended");

            window.location.href = "{{ url_for('dashboard') }}";
        }

    });

}, 3000);


</script>

</body>
</html>
