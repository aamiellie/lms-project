<!DOCTYPE html>
<html>
<head>
    <title>Live Class</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #121212;
            color: white;
            text-align: center;
        }

        video {
            width: 70%;
            margin-top: 30px;
            border-radius: 12px;
            background: black;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .end {
            background: red;
            color: white;
        }
    </style>
</head>

<body>

<h2>Live Class</h2>

<video id="camera" autoplay playsinline></video>

<br>

{% if role == "teacher" %}
<button onclick="startCamera()">Start Camera</button>
<button class="end" onclick="endClass()">End Class</button>
{% endif %}

<script>

function startCamera(){

    navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    })
    .then(stream => {
        document.getElementById("camera").srcObject = stream;
    })
    .catch(err => alert("Camera error"));
}

function endClass(){
    alert("Class ended");
    window.location.href = "/dashboard";
}

</script>

</body>
</html>
