<!DOCTYPE html>
<html>
<head>
    <title>LMS | Welcome</title>

<style>

/* =========================
COLOR THEME (WHITE + CORAL + BLACK)
========================= */

:root{
--primary:#FF6F61;        /* Coral Pink */
--secondary:#FF9A8B;      /* Light Coral */
--accent:#111111;         /* Black */
--bg:#FFFFFF;
--text:#111111;
--card:#FFFFFF;
}

/* =========================
GLOBAL
========================= */

body{
margin:0;
font-family:"Poppins", sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* =========================
DYNAMIC FLOATING SHAPES
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.15;
z-index:-1;
animation:floatShape 12s infinite ease-in-out alternate;
}

.shape1{
width:250px;
height:250px;
background:var(--primary);
top:10%;
left:-80px;
}

.shape2{
width:300px;
height:300px;
background:var(--secondary);
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

.shape3{
width:200px;
height:200px;
background:black;
top:60%;
left:20%;
opacity:0.08;
animation-delay:5s;
}

@keyframes floatShape{
0%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-40px) rotate(10deg);}
100%{transform:translateY(40px) rotate(-10deg);}
}

/* =========================
NAVBAR
========================= */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 80px;
background:white;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:30px;
font-weight:700;
color:var(--primary);
letter-spacing:1px;
}

.nav-actions{
display:flex;
gap:25px;
align-items:center;
}

.nav-actions a{
color:#333;
font-weight:500;
}

.nav-btn{
padding:12px 26px;
border-radius:30px;
background:var(--primary);
color:white !important;
font-weight:600;
transition:0.3s;
}

.nav-btn:hover{
background:black;
transform:translateY(-2px);
}

/* =========================
HERO SECTION
========================= */

.hero{
display:grid;
grid-template-columns:1fr 1fr;
padding:120px 100px;
gap:60px;
align-items:center;
}

/* LEFT */

.hero-left h1{
font-size:58px;
margin-bottom:20px;
line-height:1.2;
}

.hero-left h1 span{
color:var(--primary);
}

.hero-left p{
font-size:20px;
color:#555;
margin-bottom:40px;
}

/* =========================
BUTTONS
========================= */

.hero-buttons{
display:flex;
gap:20px;
}

.btn-primary{
padding:16px 36px;
border-radius:30px;
background:var(--primary);
color:white;
font-weight:600;
transition:0.3s;
box-shadow:0 10px 25px rgba(255,111,97,0.3);
}

.btn-primary:hover{
background:black;
transform:translateY(-3px);
}

.btn-outline{
padding:16px 36px;
border:2px solid var(--primary);
border-radius:30px;
color:var(--primary);
font-weight:600;
transition:0.3s;
}

.btn-outline:hover{
background:var(--primary);
color:white;
}

/* =========================
CARD (MODERN GLASS EFFECT)
========================= */

.info-card{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
padding:50px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
transition:0.3s;
}

.info-card:hover{
transform:translateY(-10px) scale(1.02);
}

.info-card h3{
font-size:28px;
margin-bottom:25px;
color:var(--primary);
}

.info-card li{
margin-bottom:15px;
font-size:16px;
}

/* =========================
SMOOTH FADE-IN ANIMATION
========================= */

.hero-left,
.hero-right{
animation:fadeUp 1s ease forwards;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.hero{
grid-template-columns:1fr;
padding:80px 30px;
}

.hero-left h1{
font-size:38px;
}

.navbar{
padding:20px;
}

}
/* =========================
MINIMAL OUTLINE RINGS (NO GLOW)
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
pointer-events:none;
animation:floatRing 16s infinite ease-in-out alternate;
}

/* BIG RING */
.ring1{
width:320px;
height:180px;
border:3px solid rgba(255,111,97,0.35); /* darker than shapes */
top:18%;
right:8%;
}

/* MEDIUM RING */
.ring2{
width:240px;
height:140px;
border:2px solid rgba(255,111,97,0.28);

bottom:-60px;
left:50%;
transform:translateX(-50%);

animation-delay:3s;
}

/* SMALL RING */
.ring3{
width:180px;
height:100px;
border:2px solid rgba(0,0,0,0.18); /* subtle dark */
top:65%;
right:25%;
animation-delay:6s;
}

/* SMOOTH FLOATING */
@keyframes floatRing{
0%{
transform:translateY(0) rotate(0deg);
}
50%{
transform:translateY(-25px) rotate(6deg);
}
100%{
transform:translateY(25px) rotate(-6deg);
}
}
/* REMOVE UNDERLINES FROM ALL LINKS */
a{
text-decoration:none;
}
</style>
</head>

<body>

<!-- BACKGROUND BLOBS -->
<div class="shape shape1"></div>
<div class="shape shape2"></div>
<div class="shape shape3"></div>
<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">LMS</div>
    <div class="nav-actions">
        <a href="/login">Login</a>
        <a href="/register" class="nav-btn">Register</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">

    <div class="hero-left">
        <h1>Smart Learning Starts Here 🚀</h1>
        <p>
            A powerful and modern platform for managing classrooms,
            tracking progress, and enhancing student learning.
        </p>

        <div class="hero-buttons">
            <a href="/register" class="btn-primary">Get Started</a>
            <a href="/login" class="btn-outline">Login</a>
        </div>
    </div>

    <div class="hero-right">
        <div class="info-card">
            <h3>Why Choose Our LMS?</h3>
            <ul>
                <li>Interactive Classrooms</li>
                <li>Assignment Tracking</li>
                <li>Performance Analytics</li>
                <li>Community Engagement</li>
            </ul>
        </div>
    </div>

</section>

</body>
</html>
