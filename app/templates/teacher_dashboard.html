<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard | LUMA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        function copyCode(code) {
            navigator.clipboard.writeText(code);
            alert("Invite code copied: " + code);
        }
    </script>

<style>

/* =========================
COLOR THEME (PURPLE + WHITE + BLACK)
========================= */

:root{
--primary:#4CAF50;      /* green */
--secondary:#2196F3;    /* blue */
--accent:#BBDEFB;       /* light blue */
--bg:#FFFFFF;
--text:#111111;
--card:#FFFFFF;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body.teacher-theme{
margin:0;
font-family:"Poppins", sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* =========================
FLOATING SHAPES
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 4s infinite ease-in-out alternate;
}

.shape1{
width:240px;
height:240px;
background:var(--primary);   /* green */
top:5%;
left:-80px;
}

.shape2{
width:280px;
height:280px;
background:var(--secondary); /* blue */
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-30px);}
100%{transform:translateY(30px);}
}

/* =========================
OUTLINE RINGS
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
pointer-events:none;
animation:floatRing 4s infinite ease-in-out alternate;
}

.ring1{
width:260px;
height:150px;
border:2px solid rgba(76,175,80,0.25);
top:20%;
right:10%;
}

.ring2{
width:220px;
height:120px;
border:2px solid rgba(76,175,80,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:3s;
}

@keyframes floatRing{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(20px);}
}

/* =========================
CONTAINER
========================= */

.dashboard-container{
padding:60px 100px;
}

/* =========================
HEADER
========================= */

.dashboard-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.dashboard-header h2{
font-size:34px;
margin:0;
}

/* LOGOUT */

.logout-btn{
text-decoration:none;
padding:10px 22px;
border-radius:30px;
background:var(--primary);
color:white;
font-weight:600;
transition:0.3s;
}

.logout-btn:hover{
background:black;
transform:translateY(-2px);
}

/* =========================
WELCOME TEXT
========================= */

.welcome-text{
font-size:18px;
color:#666;
margin-bottom:35px;
}

/* =========================
ACTION BUTTON
========================= */

.dashboard-actions{
margin-bottom:35px;
}

.action-card{
background:var(--primary);
color:white;
padding:16px 28px;
border-radius:30px;
cursor:pointer;
font-weight:600;
font-size:16px;
border:none;
transition:0.3s;
box-shadow:0 10px 25px rgba(76,175,80,0.3);
}

.action-card:hover{
background:black;
transform:translateY(-3px);
}

/* =========================
CREATE BOX
========================= */

#createClassroomBox{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
border-radius:18px;
padding:30px;
margin-bottom:40px;
display:none;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.show-create-box{
display:block !important;
}

#createClassroomBox label{
font-size:14px;
margin-bottom:6px;
display:block;
}

#createClassroomBox input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid var(--border);
margin-bottom:15px;
transition:0.3s;
}

#createClassroomBox input:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 3px rgba(76,175,80,0.15);
}

/* BUTTON */

.create-btn{
background:var(--primary);
color:white;
padding:12px 20px;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.create-btn:hover{
background:black;
}

/* =========================
SECTION TITLE
========================= */

.section-title{
font-size:26px;
margin-bottom:25px;
}

/* =========================
GRID
========================= */

.classroom-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:25px;
}

/* =========================
CARD
========================= */

.classroom-card{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:22px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
transition:0.3s;
}

.classroom-card:hover{
transform:translateY(-8px) scale(1.02);
}

/* TITLE */

.classroom-title{
font-weight:600;
font-size:18px;
text-decoration:none;
color:var(--text);
display:block;
margin-bottom:12px;
}

.classroom-title:hover{
color:var(--primary);
}

/* INVITE */

.invite-section{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.invite-label{
font-size:13px;
color:#777;
}

.invite-code{
background:#E3F2FD;  /* light blue */
padding:6px 10px;
border-radius:6px;
font-size:13px;
}

/* COPY BUTTON */

.copy-btn{
border:none;
background:var(--primary);
color:white;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:13px;
transition:0.3s;
}

.copy-btn:hover{
background:black;
}

/* EMPTY */

.empty-text{
color:#777;
font-style:italic;
}

/* =========================
SMALL FLOATING CIRCLES
========================= */

.circle{
position:fixed;
border-radius:50%;
z-index:-1;
opacity:0.12;
animation:floatCircle 4s infinite ease-in-out alternate;
}

/* filled circles */

.circle1{
width:60px;
height:60px;
background:var(--primary);
top:30%;
left:15%;
}

.circle2{
width:40px;
height:40px;
background:var(--secondary);
top:70%;
right:20%;
animation-delay:2s;
}

.circle3{
width:30px;
height:30px;
background:black;
top:50%;
left:60%;
opacity:0.08;
animation-delay:4s;
}

/* =========================
SMALL OUTLINE CIRCLE RINGS
========================= */

.circle-ring{
position:fixed;
border-radius:50%;
z-index:-1;
pointer-events:none;
animation:floatCircleRing 4s infinite ease-in-out alternate;
}

/* outline rings */

.circle-ring1{
width:80px;
height:80px;
border:2px solid rgba(33,150,243,0.2);
top:40%;
right:10%;
}

.circle-ring2{
width:50px;
height:50px;
border:2px solid rgba(0,0,0,0.15);
bottom:25%;
left:25%;
animation-delay:3s;
}

.circle-ring3{
width:70px;
height:70px;
border:2px solid rgba(33,150,243,0.25);
top:15%;
left:40%;
animation-delay:5s;
}

/* =========================
ANIMATIONS
========================= */

@keyframes floatCircle{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(20px);}
}

@keyframes floatCircleRing{
0%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-15px) rotate(5deg);}
100%{transform:translateY(15px) rotate(-5deg);}
}
</style>
</head>
<body class="teacher-theme">
    <div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>

<div class="dashboard-container">
    <!-- SMALL FILLED CIRCLES -->
<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<!-- SMALL OUTLINE CIRCLE RINGS -->
<div class="circle-ring circle-ring1"></div>
<div class="circle-ring circle-ring2"></div>
<div class="circle-ring circle-ring3"></div>

    <!-- HEADER -->
    <div class="dashboard-header">
        <h2>Teacher Dashboard</h2>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <p class="welcome-text">Welcome, {{ name }} 👋</p>

    <!-- ACTION BUTTONS -->
    <div class="dashboard-actions">

    <button class="action-card" onclick="toggleCreateBox()">
        + Create Virtual Classroom
    </button> 
</div>

<!-- CREATE CLASSROOM FORM (HIDDEN INITIALLY) -->

<div id="createClassroomBox" class="create-box-hidden">

    <form method="POST" action="/teacher/create-classroom">

        <label>Classroom Name</label>
        <input type="text" name="class_name" required>

        <button type="submit" class="create-btn">
            Create Classroom
        </button>

    </form>

</div>

    <!-- CLASSROOMS -->
    <h3 class="section-title">Your Classrooms</h3>

    {% if classrooms %}
        <div class="classroom-grid">
            {% for classroom in classrooms %}
                <div class="classroom-card">

                    <a href="/teacher/classroom/{{ classroom._id }}" class="classroom-title">
                        {{ classroom.class_name }}
                    </a>

                    <div class="invite-section">
                        <span class="invite-label">Invite Code:</span>
                        <span class="invite-code">{{ classroom.invite_code }}</span>
                        <button class="copy-btn"
                            onclick="copyCode('{{ classroom.invite_code }}')">
                            Copy
                        </button>
                    </div>

                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="empty-text">You haven’t created any classrooms yet.</p>
    {% endif %}

</div>

</body>
<script>
function toggleCreateBox() {
    const box = document.getElementById("createClassroomBox");
    box.classList.toggle("show-create-box");
}
</script>
</html>
