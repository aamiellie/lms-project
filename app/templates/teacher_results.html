<!DOCTYPE html>
<html>
<head>
    <title>Student Results</title>

<style>

/* =========================
COLOR THEME
========================= */

:root{
--green:#64a959;
--green-light:#60ca82;
--purple:#7C3AED;
--bg:#FFFFFF;
--text:#111111;
--card:#FFFFFF;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
margin:0;
padding:60px 80px;
background:var(--bg);
color:var(--text);
font-family:"Poppins", sans-serif;
overflow-x:hidden;
}

/* =========================
FLOATING SHAPES (4s)
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 4s infinite ease-in-out alternate;
}

.shape1{
width:220px;
height:220px;
background:var(--green);
top:5%;
left:-80px;
}

.shape2{
width:260px;
height:260px;
background:var(--purple);
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-25px);}
100%{transform:translateY(25px);}
}

/* =========================
RINGS (4s)
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
animation:floatRing 4s infinite ease-in-out alternate;
}

.ring1{
width:240px;
height:140px;
border:2px solid rgba(100,169,89,0.25);
top:20%;
right:10%;
}

.ring2{
width:200px;
height:120px;
border:2px solid rgba(124,58,237,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

@keyframes floatRing{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(20px);}
}

/* =========================
TITLE
========================= */

h2{
font-size:30px;
margin-bottom:25px;
}

/* =========================
TABLE CONTAINER
========================= */

.table-wrapper{
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
border-radius:20px;
padding:25px;
overflow-x:auto;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

/* =========================
TABLE
========================= */

table{
width:100%;
border-collapse:collapse;
}

/* HEADER */

th{
background:#111111;
color:white;
padding:14px;
font-size:14px;
text-align:center;
}

/* DATA */

td{
padding:14px;
border-bottom:1px solid var(--border);
text-align:center;
font-size:14px;
}

/* ROW HOVER */

tr:hover{
background:#f9fafb;
}

/* =========================
SCORE
========================= */

.score-highlight{
color:var(--green);
font-weight:600;
}

/* =========================
EMPTY
========================= */

.no-results{
color:#777;
font-style:italic;
font-size:14px;
}

/* =========================
BACK LINK
========================= */

.back-link{
display:inline-block;
margin-top:25px;
font-size:14px;
text-decoration:none;
color:var(--purple);
font-weight:600;
}

.back-link:hover{
color:black;
}
.score-highlight{
color:var(--green);
font-weight:700;
}
</style>
</head>

<body>
<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<h2>📊 Student Performance</h2>

{% if results and results|length > 0 %}

<div class="table-wrapper">
<table>
    <tr>
        <th>Student Name</th>
        <th>Video</th>
        <th>Correct</th>
        <th>Total</th>
        <th>Score (%)</th>
    </tr>

    {% for r in results %}
    <tr>
        <td>{{ r.student_name }}</td>
        <td>{{ r.video_title }}</td>
        <td>{{ r.correct }}</td>
        <td>{{ r.total }}</td>
        <td class="score-highlight">{{ r.score }}%</td>
    </tr>
    {% endfor %}
</table>
</div>

{% else %}

<p class="no-results">No results yet.</p>

{% endif %}

<a href="javascript:history.back()" class="back-link">
    ⬅ Back
</a>

</body>
</html>
