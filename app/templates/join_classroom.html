<!DOCTYPE html>
<html>
<head>
<title>Join Classroom | LMS</title>

<style>

/* =========================
COLOR SYSTEM (YOUR PALETTE)
========================= */

:root{
--bg:#FFFFFF;
--text:#190019;
--primary:#2B124C;
--secondary:#522B5B;
--accent:#854F6C;
--soft:#DFB6B2;
--light:#FBE4D8;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
font-family:"Poppins", sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-size:16px;
overflow:hidden;
}

/* =========================
CARD
========================= */

.join-card{
background:white;
padding:40px;
width:380px;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
text-align:center;
border:1px solid var(--light);
z-index:1;
}

/* =========================
TITLE
========================= */

h2{
font-size:26px;
margin-bottom:25px;
color:var(--primary);
}

/* =========================
LABEL
========================= */

label{
font-size:14px;
display:block;
margin-bottom:6px;
color:#555;
}

/* =========================
INPUT
========================= */

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid var(--border);
font-size:14px;
margin-bottom:20px;
transition:0.3s;
background:#fafafa;
}

input:focus{
outline:none;
border-color:var(--primary);
background:white;
box-shadow:0 0 0 3px rgba(43,18,76,0.1);
}

/* =========================
BUTTON
========================= */

button{
width:100%;
padding:12px;
background:var(--primary);
border:none;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
color:white;
transition:0.3s;
}

button:hover{
background:var(--secondary);
transform:translateY(-2px);
}

/* =========================
BACK LINK
========================= */

.back-link{
display:inline-block;
margin-top:20px;
font-size:14px;
text-decoration:none;
color:var(--primary);
font-weight:500;
}

.back-link:hover{
color:var(--accent);
}

/* =========================
FLOATING SHAPES (4s)
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.10;
z-index:-1;
animation:floatShape 4s infinite ease-in-out alternate;
}

.shape1{
width:220px;
height:220px;
background:#DFB6B2;
top:10%;
left:-80px;
}

.shape2{
width:240px;
height:240px;
background:#522B5B;
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

/* =========================
RINGS
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
animation:floatRing 4s infinite ease-in-out alternate;
}

.ring1{
width:240px;
height:140px;
border:2px solid rgba(43,18,76,0.25);
top:20%;
right:10%;
}

.ring2{
width:180px;
height:110px;
border:2px solid rgba(133,79,108,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

.ring3{
width:100px;
height:70px;
border:2px solid rgba(82,43,91,0.2);
top:50%;
left:10%;
animation-delay:2s;
}

/* =========================
CIRCLES
========================= */

.circle{
position:fixed;
border-radius:50%;
opacity:0.08;
z-index:-1;
animation:floatCircle 4s infinite ease-in-out alternate;
}

.circle1{
width:30px;
height:30px;
background:#522B5B;
top:40%;
left:25%;
}

.circle2{
width:25px;
height:25px;
background:#DFB6B2;
top:75%;
right:25%;
animation-delay:1s;
}

/* =========================
ANIMATIONS
========================= */

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(20px);}
}

@keyframes floatRing{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(15px);}
}

@keyframes floatCircle{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(10px);}
}
</style>

</head>

<body>
<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="join-card">

<h2>Join Virtual Classroom</h2>

<form method="POST">

<label>Invite Code</label>
<input type="text" name="invite_code" required>
<button type="submit">Join Classroom</button>

</form>

<a href="/student/dashboard" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
