<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
</head>
<body>

<h2>Attendance</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Date</th>
    <th>Name</th>
    <th>Email</th>
    <th>Time (sec)</th>
</tr>

{% for r in records %}
<tr>
    <td>{{ r.join_time.strftime("%d %b %Y") }}</td>
    <td>{{ r.name }}</td>
    <td>{{ r.email }}</td>
    <td>{{ r.duration }}</td>
</tr>
{% endfor %}

</table>
</body>
</html>
