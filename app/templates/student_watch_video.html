<!DOCTYPE html>
<html>
<head>
    <title>{{ video.title }}</title>

<style>

/* =========================
COLOR SYSTEM (YOUR PALETTE)
========================= */

:root{
--bg:#FFFFFF;
--text:#190019;
--primary:#2B124C;
--secondary:#522B5B;
--accent:#854F6C;
--soft:#DFB6B2;
--light:#FBE4D8;
--border:#E5E7EB;
}

/* =========================
GLOBAL
========================= */

body{
font-family:"Poppins", sans-serif;
background:var(--bg);
color:var(--text);
padding:60px 100px;
font-size:16px;
overflow-x:hidden;
}

/* =========================
TITLE
========================= */

h2{
font-size:30px;
margin-bottom:8px;
color:var(--primary);
}

p{
color:#666;
margin-bottom:25px;
font-size:14px;
}

/* =========================
LAYOUT
========================= */

.container{
display:flex;
gap:25px;
align-items:flex-start;
}

/* =========================
VIDEO PANEL
========================= */

.left{
width:60%;
background:white;
border-radius:16px;
padding:18px;
border:1px solid var(--light);
box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

video{
width:100%;
border-radius:12px;
}

/* =========================
RIGHT SIDE
========================= */

.right{
width:40%;
display:flex;
flex-direction:column;
gap:18px;
}

/* =========================
BOX
========================= */

.box{
background:white;
border-radius:10px;
padding:7px;
border:1px solid var(--light);
box-shadow:0 8px 20px rgba(0,0,0,0.05);
transition:0.3s;
}

.box:hover{
transform:translateY(-4px);
border-color:var(--soft);
}

.box h4{
color:var(--secondary);
margin-bottom:10px;
font-weight:600;
font-size:16px;
}

/* =========================
BUTTONS
========================= */

button{
margin-top:1px;
padding:10px 16px;
background:var(--primary);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:0.3s;
}

button:hover{
background:var(--secondary);
transform:translateY(-2px);
}

/* =========================
QUIZ BUTTON
========================= */

.quiz-btn{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:var(--primary);
color:white;
border-radius:10px;
text-decoration:none;
font-weight:600;
font-size:14px;
}

/* =========================
OPTIONS
========================= */

#optionsArea label{
font-size:14px;
margin-left:6px;
}

/* =========================
FEEDBACK
========================= */

.correct{
color:#2E7D32;
font-weight:600;
}

.wrong{
color:#C62828;
font-weight:600;
}

.hidden{
display:none;
}

/* =========================
BACK LINK
========================= */

a{
color:var(--primary);
font-size:14px;
text-decoration:none;
font-weight:500;
}

a:hover{
color:var(--accent);
}

/* =========================
FLOATING SHAPES (4s)
========================= */

.shape{
position:fixed;
border-radius:40px;
opacity:0.12;
z-index:-1;
animation:floatShape 4s infinite ease-in-out alternate;
}

.shape1{
width:240px;
height:240px;
background:#DFB6B2;
top:5%;
left:-80px;
}

.shape2{
width:260px;
height:260px;
background:#522B5B;
bottom:-120px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

/* =========================
RINGS
========================= */

.ring{
position:fixed;
border-radius:50px;
z-index:-1;
animation:floatRing 4s infinite ease-in-out alternate;
}

.ring1{
width:260px;
height:150px;
border:2px solid rgba(43,18,76,0.25);
top:20%;
right:10%;
}

.ring2{
width:200px;
height:120px;
border:2px solid rgba(133,79,108,0.25);
bottom:-60px;
left:50%;
transform:translateX(-50%);
animation-delay:1s;
}

/* =========================
SMALL CIRCLES
========================= */

.circle{
position:fixed;
border-radius:50%;
opacity:0.10;
z-index:-1;
animation:floatCircle 4s infinite ease-in-out alternate;
}

.circle1{
width:40px;
height:40px;
background:#522B5B;
top:40%;
left:20%;
}

.circle2{
width:30px;
height:30px;
background:#DFB6B2;
top:70%;
right:20%;
animation-delay:1s;
}

/* =========================
ANIMATIONS
========================= */

@keyframes floatShape{
0%{transform:translateY(0);}
50%{transform:translateY(-25px);}
100%{transform:translateY(25px);}
}

@keyframes floatRing{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(20px);}
}

@keyframes floatCircle{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(15px);}
}
</style>
</head>

<body>
<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<h2>{{ video.title }}</h2>
<p>{{ video.description }}</p>

<div class="container">

    <!-- LEFT: VIDEO -->
    <div class="left">
        <video id="lectureVideo" controls>
            <source src="/videos/{{ video.video_filename }}" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <!-- Presentation -->

        <!-- Questions -->
        <div class="box">
            <h4>❓ Questions</h4>

            <div id="questionArea" class="hidden">
                <p id="questionText"></p>
                <div id="optionsArea"></div>
                <button onclick="submitAnswer()">Submit</button>
                <p id="feedback"></p>
            </div>

            <p id="waitingText">Questions will appear during the class.</p>
        </div>

                <div class="box">
    <h4>📊 Presentation</h4>

    {% if video.source_file %}
        <iframe 
            src="/uploads/{{ video.source_file }}" 
            width="100%" 
            height="350px"
            style="border:none; border-radius:10px; overflow:hidden;">
        </iframe>
          <br>
        <a href="/uploads/{{ video.source_file }}" target="_blank"
           style="
                display:inline-block;
                padding:8px 12px;
                background:#2B124C;
                color:white;
                border-radius:8px;
                text-decoration:none;
                font-size:13px;
           ">
            📥 Download PDF
        </a>
    {% else %}
        <p>No presentation available.</p>
    {% endif %}

</div>

    </div>

</div>


<button onclick="handleQuizClick()">
    Take After Class Quiz
</button>

<br><br>
<a href="/student/classroom/{{ classroom._id }}">⬅ Back to Classroom</a>

<script>
    const video = document.getElementById("lectureVideo");

    const questions = {{ questions | tojson }};
    let askedQuestions = [];
    let currentQuestion = null;

    video.addEventListener("timeupdate", function() {
        const currentTime = Math.floor(video.currentTime);

        questions.forEach(q => {
            if (!askedQuestions.includes(q._id) && q.ask_time !== null) {
                if (currentTime === q.ask_time) {
                    pauseAndAsk(q);
                }
            }
        });
    });

    function pauseAndAsk(question) {
        video.pause();
        currentQuestion = question;

        document.getElementById("waitingText").classList.add("hidden");
        document.getElementById("questionArea").classList.remove("hidden");

        document.getElementById("questionText").innerText = question.question;

        const optionsArea = document.getElementById("optionsArea");
        optionsArea.innerHTML = "";

        const letters = ["A", "B", "C", "D"];

        question.options.forEach((option, index) => {

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "option";   // ✅ correct
            radio.value = letters[index];

            const label = document.createElement("label");
            label.innerText = letters[index] + ". " + option;

            optionsArea.appendChild(radio);
            optionsArea.appendChild(label);
            optionsArea.appendChild(document.createElement("br"));
        });
    }

    function submitAnswer() {

        const selected = document.querySelector('input[name="option"]:checked');  // ✅ FIXED
        const feedback = document.getElementById("feedback");

        if (!selected) {
            feedback.innerHTML = "<span style='color:orange;'>Please select an answer.</span>";
            return;
        }

        const selectedLetter = selected.value;

        if (selectedLetter === currentQuestion.correct_answer) {

            feedback.innerHTML = `
                <div class="correct">
                    Correct ✅
                </div>
                <br>
                <button onclick="continueVideo()">OK</button>
            `;

        } else {

            feedback.innerHTML = `
                <div class="wrong">
                    Wrong ❌
                </div>
                <br>
                <strong>Correct answer:</strong> ${currentQuestion.correct_answer}
                <br><br>
                ${currentQuestion.explanation}
                <br><br>
                <button onclick="continueVideo()">OK</button>
            `;
        }

        askedQuestions.push(currentQuestion._id);
    }

    function continueVideo() {
        document.getElementById("questionArea").classList.add("hidden");
        document.getElementById("waitingText").classList.remove("hidden");
        document.getElementById("feedback").innerHTML = "";
        video.play();
    }
</script>
<script>
const quizDone = {{ 'true' if quiz_done else 'false' }};

function handleQuizClick(){
    if(quizDone === true){
        alert("⚠️ You have already attended this quiz!");
    } else {
        window.location.href = "/student/classroom/{{ classroom._id }}/video/{{ video._id }}/quiz";
    }
}
</script>
</body>
</html>
